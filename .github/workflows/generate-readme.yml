name: Update README

on:
  push:
    branches:
      - main
    paths:
      - '_README.md'

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1

      - name: Generate README.md
        run: |
          python3 generate_readme.py _README.md > README.md

      - name: Lint README.md
        run: npx awesome-lint README.md

      - name: Commit changes
        if: success() # Only commit if linting passes
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # sanad: ref=v7.2.0
        with:
          commit_message: 'Auto-update README.md [skip ci]'
          file_pattern: README.md
