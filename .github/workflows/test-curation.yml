name: Test curation automation

on:
  pull_request:
    paths:
      - '.github/scripts/**'
      - '.github/curation.json'
      - '.github/workflows/*curation*'
      - '.github/workflows/admission.yml'
      - 'tests/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # sanad: ref=v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s tests -v
